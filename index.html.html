<script>/* 剧情与表现层分离：增加章节只需增加节点，选项的条件由引擎统一判断。 */
(function(root){
const clues={letter:{name:'亡姐的旧信',mark:'信',text:'「阿遥，若有人说忘记我就能救城，先问他：谁有权替旁人忘记？」落款是三年前溺亡的姐姐沈照。信纸里夹着七道细小针孔。'},score:{name:'残缺的灯谱',mark:'谱',text:'前六灯分收喜、怒、哀、惧、爱、欲，第七灯并非灯芯，而是将六灯连在一起的「名」。末页写着：一人担名，是为执灯。'},diary:{name:'无名者的日记',mark:'记',text:'「不是河神要记忆，是我们把悲伤交给了灯。我忘了女儿，她却仍在每夜敲门。自愿分担、各记一字，或可拆去独名之锁。」'},jade:{name:'双鱼玉佩',mark:'玉',text:'断口吻合姐姐留下的另一半。内侧刻着「照、遥」，背面是七条水渠。它既是亲缘凭证，也是旧灯台的泄流钥匙。'},seventh:{name:'第七灯的记载',mark:'灯',text:'第七灯以一个人的名字封存全城记忆。若将玉佩置于泄流槽，以灯谱逆转水渠，再由知情者自愿记住失去的人，记忆便能归还，而非焚毁。'}};
const endings={dark:{name:'长夜无灯',subtitle:'你保住了自己，却没能带走长夜。',text:'你把信放回门缝，独自离城。身后的灯一盏盏暗下去，却没有真正熄灭。栖雾城仍在用遗忘抵偿旧债。许多年后，你偶尔会梦见一个撑伞的女子；醒来时，只记得雨声。',hint:'在最终抉择选择离城。'},sister:{name:'故人归',subtitle:'一个人的归来，是另一场漫长的离别。',text:'你以玉佩唤回沈照，将自己的名字填进灯台。她从水中醒来，终于有了体温。代价不是城中人的性命，而是你独自承受他们日复一日遗失的记忆。姐姐每天来灯塔给你送饭；你认得所有人的往事，却再也叫不出她的名字。',hint:'获得双鱼玉佩，心火至少 3，最终选择唤回姐姐。'},city:{name:'万家灯火',subtitle:'你不再记得她，城里却有人记得你。',text:'你将那封旧信送入灯中，允许灯火取走自己关于姐姐的记忆，作为解除旧契的最后一份抵偿。六灯散入街巷，城里的人终于记起亲人。你走出栖雾城，袋里有半块温润的玉，面对它却只觉得难过。茶摊的老人替你保存了一封信，等你有一天愿意重读。',hint:'心火至少 2，最终选择以自己的记忆解契。'},keeper:{name:'执灯者',subtitle:'你留下名字，为后来的人守一条归路。',text:'读懂灯谱以后，你没有继续索取记忆，而是把自己的名字系在第七灯上。旧契被暂时封住，全城得以慢慢取回往事；你则不能再离开灯台。沈照的声音渐渐散去，她最后说：守灯不是替别人选择。此后每一个想献出记忆的人，都必须先听你讲完灯火的来历。',hint:'取得残缺的灯谱，识真至少 4，失忆不超过 5。'},dawn:{name:'雾尽天明',subtitle:'没有谁必须被忘记，才配等到天亮。',text:'玉佩打开水渠，逆行的灯谱让记忆重新流动。你念出姐姐的名字，老人接过「照」字，阿砚记住「沈」字，街坊自愿讲出各自失去的人。七盏灯第一次不再吞吃记忆。沈照并没有复生，她只是从灯中走出，认真与你道别。天亮时，栖雾城仍有伤痛，却再没有人被迫遗忘。',hint:'集齐五件线索，心火至少 4、识真至少 6、失忆不超过 4，并邀请街坊共同记忆。'}};
const nodes={
gate:{chapter:'壹 · 叩雾',place:'栖雾城 · 水门',title:'死去的人，寄来一封信。',text:['三年前，姐姐沈照沉入城外的照影河。三年后，你收到她的信：「子夜前，到栖雾城。不要相信替你记得一切的人。」','你叫沈遥。此刻，湿冷的雾贴着鞋面流进城门。门内悬着六盏纸灯，河水里却有第七盏倒影。一个卖茶的老人忽然喊出你的乳名。'],speaker:'茶叟',quote:'她也问过我，忘了痛，人就能好好活下去么？',choices:[{label:'接过热茶，问老人是否见过姐姐',desc:'听一段被遗忘的往事',next:'tea',delta:{fire:1},feedback:'你没有急着抽身。老人冻僵的手松开杯沿，愿意再信你一次。'},{label:'比对信上的针孔与城门灯纹',desc:'先从信物寻找规律',next:'tea',delta:{truth:1},feedback:'针孔与七道水渠的方位一致。这封信不是召魂帖，而是一张被藏起的地图。'}]},
tea:{chapter:'壹 · 叩雾',place:'水门 · 旧茶摊',title:'有人把名字，赊给了灯。',text:['老人记得沈照曾来查失踪案，却不记得自己姓什么。三年前城里洪水将至，守灯人用一份旧契截住河水，此后所有人开始丢失往事。','桌底压着一本湿透的日记，远处一个抱着碎灯的少年正被巡夜人追赶。老人说：「那孩子叫阿砚，他娘已经忘了他。」'],choices:[{label:'替阿砚挡住巡夜人，听他说完',desc:'心火 +2 · 阿砚愿意同行',next:'archive',delta:{fire:2},flag:'friend',feedback:'你告诉巡夜人，碎灯是你碰坏的。阿砚攥住你的衣角：我知道你姐姐去过哪里。'},{label:'用一段童年记忆向老人换取日记',desc:'识真 +2 · 失忆 +1 · 获得日记',next:'archive',delta:{truth:2,loss:1},clue:'diary',feedback:'你记不起老家门前的树了。日记却揭露：城里的遗忘不是天灾，而是一种交易。'},{label:'替老人整理散页，请他读出日记',desc:'心火 +1 · 获得日记',next:'archive',delta:{fire:1},clue:'diary',feedback:'你把散页按日期排好。老人想起女儿的小名，将日记交给你：别让旁人也忘了。'}]},
archive:{chapter:'贰 · 寻名',place:'城南 · 纸扎铺',title:'纸上的火，不会烫伤谁。',text:['纸扎铺里，所有纸人都缺一只眼睛。阿砚在门外指着房梁：沈照把东西藏在灯后，她说活人应当自己读契。','掌柜不肯抬头。梁上有半卷灯谱，柜台下则摆着一个装满记忆的灯盏。你只有这一夜。'],choices:[{label:'拆开旧纸灯，取出灯谱',desc:'识真 +2 · 获得灯谱',next:'river',delta:{truth:2},clue:'score',feedback:'灯皮内写满借出的名字。你发现第七灯收的不是灵魂，而是替全城承担记忆的人。'},{label:'让阿砚带路，从后门找灯谱',desc:'需阿砚信任 · 心火 +1 · 识真 +2',requires:{flag:'friend'},next:'river',delta:{fire:1,truth:2},clue:'score',feedback:'阿砚替你扶着梯子。你答应他，若能见到他母亲，会先问她愿不愿记起。'},{label:'触碰记忆灯，亲眼看见洪水那夜',desc:'识真 +3 · 失忆 +2',next:'river',delta:{truth:3,loss:2},feedback:'沈照把灾民带上高地，却被推为契约的担名者。你看清真相，也忘了自己来时走过的路。'}]},
river:{chapter:'叁 · 照影',place:'照影河 · 断桥',title:'河里的人，没有影子。',text:['河面浮出姐姐的模样。她并非活着，也从未寄信；那封信是三年前她提前写下的，被守灯人一直扣到今夜。','「他想找个接替我的人。」沈照将半块玉佩举到水面。桥柱上刻着一篇被泥覆盖的祭文，水中的脸却正在慢慢消失。'],speaker:'沈照',quote:'阿遥，想念我不是你的错。但你不欠我另一条命。',choices:[{label:'握住她的手，接过双鱼玉佩',desc:'心火 +1 · 获得玉佩',next:'tower',delta:{fire:1},clue:'jade',feedback:'水冷得刺骨，玉却是温的。你拼合两半玉佩，看见背面的七条水渠。'},{label:'先拓下祭文，再接过玉佩',desc:'识真 +2 · 失忆 +1 · 获得玉佩',next:'tower',delta:{truth:2,loss:1},clue:'jade',feedback:'你读出「众名可替独名」。为了记住这四个字，你忘掉了姐姐曾为你唱过的一首歌。'},{label:'拒绝幻影，沿河追查灯台入口',desc:'识真 +1 · 保留自己的记忆',next:'tower',delta:{truth:1},feedback:'你没有接玉。沈照的身影散去，退潮露出一条通往灯台的石阶。'}]},

const api={fresh,allowed,choose,valid};root.FogEngine=api;if(typeof module!=='undefined')module.exports=api;

function home(){view='home';clearTimeout(toast.timer);$('#toast').classList.remove('visible');main.innerHTML=`<section class="hero"><div class="hero-copy"><div class="edition">栖雾城志异 <span>卷壹 · 记忆之契</span></div><div class="eyebrow">中式志怪 · 悬疑互动叙事</div><h1>雾灯夜行</h1><div class="english">THE LANTERN KEEPER</div><div class="tagline">如果忘记一个人，<br>就能救下一座城。</div><p class="intro">一封亡姐的来信，一座失忆的古城。<br>子夜将至，七盏灯等待一个名字。<br>而你，会如何选择？</p><div class="actions"><button class="primary" id="new">入城 · 开始故事 ↗</button><button class="secondary" id="continue" ${state?'':'disabled'}>继续夜行 →</button></div><div class="meta">约 10–15 分钟 / 五种结局 / 自动存档</div>${state?`<div class="resume-note">上次停驻 · ${state.ending?endings[state.ending].name:nodes[state.node].place}</div>`:''}</div><div class="art" role="img" aria-label="雾中的古城，暖金色纸灯悬在月下"><div class="moon"></div><div class="mountain back"></div><div class="mountain"></div><div class="city"></div><div class="bridge"></div><div class="lantern"><i class="tassel"></i></div><div class="lantern small"></div><div class="mist"></div><div class="vertical">灯照来路 · 雾藏故人</div><div class="art-caption">栖雾城 · 子夜前一刻</div></div></section><section class="home-bottom"><span><b>七盏</b>以记忆为芯的灯</span><span><b>五种</b>没有标准答案的命运</span><span><b>一念</b>由你写下的归途</span></section>`;$('#new').onclick=()=>state?confirmPanel('重新入城？','当前周目将重新开始，已解锁结局和历史线索会保留。',start):start();$('#continue').onclick=()=>{view='play';render();};}

function confirmPanel(title,text,action){openPanel('进度管理',`<h2>${title}</h2><p>${text}</p><div class="actions"><button class="primary" id="confirm">确认</button><button class="secondary" id="cancel">取消</button></div>`);$('#confirm').onclick=()=>{panel.close();action();};$('#cancel').onclick=()=>panel.close();}
function showPanel(type){if(type==='clues'){openPanel('线索档案',`<h2>记忆有迹可循</h2><p class="fine">当前周目 ${state?.clues.length||0} / 5 · 历史发现 ${collected.length} / 5。只有当前周目的线索参与结局判定。</p><div class="chips" aria-label="档案筛选"><button data-filter="all" aria-pressed="true">全部线索</button><button data-filter="found" aria-pressed="false">本周目已获</button><button data-filter="missing" aria-pressed="false">本周目未获</button></div><div class="cards">${Object.entries(clues).map(([k,c])=>{const has=state?.clues.includes(k),past=collected.includes(k);return `<div class="card ${has?'':'locked'}" data-found="${!!has}"><div class="mark">${has||past?c.mark:'？'}</div><div><h3>${has||past?c.name:'未发现的线索'} ${!has&&past?'· 往昔记录':''}</h3><p>${has||past?c.text:'继续调查栖雾城，记录会在这里出现。'}</p></div></div>`;}).join('')}</div><p class="fine" id="filter-empty" hidden>暂无符合条件的线索。</p>`);bindFilters();}
if(type==='endings'){openPanel('结局图鉴',`<h2>五条归途 · ${unlocked.length} / 5</h2><p class="fine">展开已解锁结局可重读完整故事。未解锁归途仅展示条件，不提前透露结局。</p><div class="chips" aria-label="图鉴筛选"><button data-filter="all" aria-pressed="true">全部归途</button><button data-filter="found" aria-pressed="false">已解锁</button><button data-filter="missing" aria-pressed="false">未解锁</button></div><div class="cards">${Object.entries(endings).map(([k,e],i)=>`<details class="card ending-card ${unlocked.includes(k)?'':'locked'}" data-found="${unlocked.includes(k)}"><summary><span class="mark">${i+1}</span><span>${unlocked.includes(k)?e.name:'尚未抵达的归途'}<small>${unlocked.includes(k)?'已解锁 · 点击重读':'点击查看解锁条件'}</small></span></summary><p>${unlocked.includes(k)?e.text:e.hint}</p>${unlocked.includes(k)?`<p class="fine">达成条件：${e.hint}</p>`:''}</details>`).join('')}</div><p class="fine" id="filter-empty" hidden>这里还没有记录，继续你的夜行。</p>`);bindFilters();}
if(type==='about')openPanel('关于此作',`<h2>雾灯夜行</h2><p>一款关于记忆、失去与选择权的原创中式志怪互动小说。没有正确的牺牲，只有你愿意承担的后果。</p><p class="fine">内容提示：涉及死亡、失忆与亲人离别，无血腥画面。建议 16 岁以上体验。所有主线与五个结局免费，无需账户或网络。进度只保存在此浏览器。</p><h3>故事还可以继续</h3><p>未来可扩展角色番外、城市志异系列与文旅实景叙事。当前版本没有付费入口，也不收集个人数据。</p>`);
if(type==='talk'){openPanel('预设剧情对话 · 非实时 AI',`<h2>灯下问话</h2><p class="fine">离线可用。以下回答为作者预写，不调用 AI 接口，也不影响状态或结局。</p><div class="chips"><button data-q="memory">灯为何需要记忆？</button><button data-q="sister">姐姐还活着吗？</button><button data-q="way">我该往哪里去？</button></div><div class="answer" role="status">陆沉拨了拨灯芯：「问吧。但不要把我的话当作唯一的真相。」</div>`);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('.answer').textContent={memory:'「灯执行的是旧契。记忆能暂压洪水，却不该由我替所有人决定交出什么。你可以去读原契。」',sister:state?.clues.includes('jade')?'「她的记忆困在灯中，身体早已逝去。若要唤她回来，须有人承受灯中的债。她是否愿意，你也该听一听。」':'「河边或许有她留下的东西。比起相信我，你更应该自己去看。」',way:state?.node==='final'?'「看看你的线索与状态。灰色选项会告诉你条件。即使没有找到全部答案，你也仍然有选择。」':'「先听人说话，再读他们留下的字。纸扎铺、照影河和灯塔，都有你需要知道的事。」'}[b.dataset.q];});}}
function bindFilters(){document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));let visible=0;document.querySelectorAll('.card[data-found]').forEach(c=>{c.hidden=b.dataset.filter==='found'?c.dataset.found!=='true':b.dataset.filter==='missing'?c.dataset.found==='true':false;if(!c.hidden)visible++;});$('#filter-empty').hidden=visible>0;});}
function bindPanels(){document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>showPanel(b.dataset.panel));}
$('#close-panel').onclick=()=>panel.close();$('#home-link').onclick=e=>{e.preventDefault();home();};$('#reset').onclick=()=>confirmPanel('清除所有旅程？','将删除当前存档、历史线索及全部结局记录。此操作无法撤销。',()=>{state=null;unlocked=[];collected=[];save();home();toast('进度已重置');});save();home();bindPanels();if(recoveryNotice)toast(recoveryNotice);

/* Web Audio 合成环境声，无外部音频与版权素材。只在用户操作后启动。 */
(()=>{
let ctx,master,playing=false,volume=.25,timer;
const button=document.createElement('button');button.id='audio-toggle';button.type='button';button.textContent='环境声 · 关闭';button.setAttribute('aria-pressed','false');
const slider=document.createElement('input');slider.type='range';slider.min='0';slider.max='100';slider.value='25';slider.id='audio-volume';slider.setAttribute('aria-label','环境声音量');
const wrap=document.createElement('div');wrap.className='audio-controls';wrap.append(button,slider);document.querySelector('footer').append(wrap);
function bell(){if(!playing||document.hidden)return;const now=ctx.currentTime;[440,660,887].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.018/(i+1),now+.03);g.gain.exponentialRampToValueAtTime(.0001,now+4);o.connect(g).connect(master);o.start();o.stop(now+4.1);});}
function init(){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
// 连续风声经过低通滤波，避免刺耳的高频。
const buffer=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.3;
const wind=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),windGain=ctx.createGain();wind.buffer=buffer;wind.loop=true;filter.type='lowpass';filter.frequency.value=380;windGain.gain.value=.18;wind.connect(filter).connect(windGain).connect(master);wind.start();
[73.42,110,146.83].forEach((f,i)=>{const tone=ctx.createOscillator(),gain=ctx.createGain();tone.type='sine';tone.frequency.value=f;gain.gain.value=.035/(i+1);tone.connect(gain).connect(master);tone.start();});}
function fade(value){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(value,ctx.currentTime,.25);}
button.onclick=async()=>{try{if(!ctx)init();await ctx.resume();playing=!playing;fade(playing?volume:0);button.textContent='环境声 · '+(playing?'开启':'关闭');button.setAttribute('aria-pressed',String(playing));clearInterval(timer);if(playing){bell();timer=setInterval(bell,12000);}}catch{button.textContent='此浏览器不支持环境声';button.disabled=true;}};
slider.oninput=()=>{volume=Number(slider.value)/100;if(ctx)fade(playing&&!document.hidden?volume:0);};
// 切换到其他页面时静音，返回后恢复玩家选择的音量。
document.addEventListener('visibilitychange',()=>{if(ctx)fade(playing&&!document.hidden?volume:0);});
})();
</script></body></html>
